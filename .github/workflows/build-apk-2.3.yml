name: Build APK 3.0 Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Aviator Signal Lab 3.0
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc

          test -f aviator-android-final-3.0.zip

          unzip -q aviator-android-final-3.0.zip -d buildsrc

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project
        working-directory: buildsrc
        run: |
          echo "Project files:"
          find . -maxdepth 3 -type f | sort
          echo ""
          echo "Gradle version:"
          gradle --version

      - name: Build Debug APK
        working-directory: buildsrc
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        working-directory: buildsrc
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aviator-signal-lab-3.0-debug-apk
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
